name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v4
      - run: npm ci
      - name: Run HTMLHint
        run: npx htmlhint "src/**/*.html"
      - name: Run Stylelint
        run: npx stylelint "styles/**/*.css"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v4
      - run: npm ci
      - name: Install Parcel
        run: npm install -D parcel
      - name: Build site
        run: npx parcel build src/index.html --dist-dir dist
